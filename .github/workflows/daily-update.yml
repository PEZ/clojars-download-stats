name: Daily Clojars Update

on:
  schedule:
    # Clojars publishes stats at 01:15 US Eastern (~06:15 UTC)
    # Run at 07:00 UTC (primary) and 15:00 UTC (backup if morning run misses)
    # The task is idempotent - if 07:00 succeeds, 15:00 will no-op
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write  # Required to push commits

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: latest

      - name: Fetch latest Clojars and append to exports
        run: bb clojars.export.update

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes to commit
          if git diff --quiet data/; then
            echo "No new data to commit"
          else
            git add data/
            git commit -m "chore: Update Clojars data for $(date -u +%Y-%m-%d)"
            git push
          fi
